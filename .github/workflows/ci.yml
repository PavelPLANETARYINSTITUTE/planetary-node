name: Planetary Node CI

# Конвейер запускается при любом push или pull-request в главную ветку репозитория
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-with: ubuntu-latest

    steps:
    # Шаг 1: Клонирование исходного кода репозитория в тестовую среду GitHub
    - name: Checkout repository code
      uses: actions/checkout@v4

    # Шаг 2: Развертывание изолированного окружения Python для аудита ai_core
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # Шаг 3: Тестирование логики аналитического ядра ИИ (проверка filter.py)
    - name: Test AI-Core filter and classification logic
      run: |
        python ai_core/filter.py

    # Шаг 4: Развертывание Docker Buildx для проверки кроссплатформенной сборки
    - name: Set up Docker Buildx
      uses: actions/setup-buildx-action@v3

    # Шаг 5: Тестовая компиляция контейнера Dockerfile (без публикации в Docker Hub)
    # Этот шаг гарантирует, что изменения волонтеров в коде не ломают сборку ноды
    - name: Build local Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: false
        tags: planetaryinstitute/node:test
        cache-from: type=gha
        cache-to: type=gha,mode=max
